# This file is a TEMPLATE (mounted in /etc/nginx/templates/): when the container starts, the
# image fills in the resolver line below with the nameserver(s) of /etc/resolv.conf. That is
# 127.0.0.11 under Docker but the network gateway (aardvark-dns) under Podman, so it cannot
# be hard-coded. Other nginx variables ($uri, ...) are left alone.
#
# The DNS server returns every replica of `app`. Using a variable in proxy_pass makes nginx
# re-resolve it (valid=5s) instead of freezing the IPs at startup, so scaling the app up or
# down is picked up without a reload, and nginx can start before the app does.
resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;

# Cache policy for the CDN/browser. The CRA build hashes asset filenames, so
# /static/ is safe to cache forever; the dataset is read-only, so API answers
# can be cached at the edge (s-maxage = shared caches only, not browsers).
# index.html must always revalidate so new deploys are picked up.
map $uri $cache_control {
    default                      "no-cache";
    ~^/static/                   "public, max-age=31536000, immutable";
    ~^/(allmovies|statistics)$   "public, s-maxage=60";
}

server {
    listen 8080;   # unprivileged port: nginx runs as a non-root user without any capability

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location / {
        set $upstream http://app:5000;
        proxy_pass $upstream;

        proxy_hide_header Cache-Control;
        add_header Cache-Control $cache_control always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
        # Retry another replica if one is restarting / unhealthy.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
