# Docker's embedded DNS returns every replica of `app`. Using a variable in
# proxy_pass makes nginx re-resolve it (valid=5s) instead of freezing the IPs
# at startup, so `docker compose up --scale app=N` is picked up without a reload.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location / {
        set $upstream http://app:5000;
        proxy_pass $upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
        # Retry another replica if one is restarting / unhealthy.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
