# Docker's embedded DNS returns every replica of `app`. Using a variable in
# proxy_pass makes nginx re-resolve it (valid=5s) instead of freezing the IPs
# at startup, so `docker compose up --scale app=N` is picked up without a reload.
resolver 127.0.0.11 valid=5s ipv6=off;

# nginx's own response cache for the two read-only API routes, shared by all replicas.
# 10m of keys (~80k entries), at most 100m of responses, dropped after 10 min unused.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=10m use_temp_path=off;

# Only these routes go through the cache; everything else (index.html, static files) bypasses it.
map $uri $skip_cache {
    default                      1;
    ~^/(allmovies|statistics)$   0;
}

# Cache policy for the CDN/browser. The CRA build hashes asset filenames, so
# /static/ is safe to cache forever; the dataset is read-only, so API answers
# can be cached at the edge (s-maxage = shared caches only, not browsers).
# index.html must always revalidate so new deploys are picked up.
map $uri $cache_control {
    default                      "no-cache";
    ~^/static/                   "public, max-age=31536000, immutable";
    ~^/(allmovies|statistics)$   "public, s-maxage=60";
}

server {
    listen 80;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location / {
        set $upstream http://app:5000;
        proxy_pass $upstream;

        proxy_hide_header Cache-Control;
        add_header Cache-Control $cache_control always;

        proxy_cache           api_cache;
        proxy_cache_key       $request_uri;                  # path + query string
        proxy_cache_valid     201 60s;                       # the API answers 201, not 200
        # skip the cache for other routes, and on demand with the header "X-No-Cache: 1" (load tests)
        proxy_cache_bypass    $skip_cache $http_x_no_cache;
        proxy_no_cache        $skip_cache $http_x_no_cache;
        proxy_cache_lock      on;                            # concurrent identical misses -> one backend request
        # serve a stale answer rather than an error if every replica is busy or restarting
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;   # HIT / MISS / BYPASS / STALE

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
        # Retry another replica if one is restarting / unhealthy.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
