# This file is a TEMPLATE (mounted in /etc/nginx/templates/): when the container starts, the
# image fills in the resolver line below with the nameserver(s) of /etc/resolv.conf. That is
# 127.0.0.11 under Docker but the network gateway (aardvark-dns) under Podman, so it cannot
# be hard-coded. Other nginx variables ($uri, ...) are left alone.
#
# The DNS server returns every replica of `app`. Using a variable in proxy_pass makes nginx
# re-resolve it (valid=5s) instead of freezing the IPs at startup, so scaling the app up or
# down is picked up without a reload, and nginx can start before the app does.
resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;

# nginx's own response cache for the two read-only API routes, shared by all replicas.
# 10m of keys (~80k entries), at most 100m of responses, dropped after 10 min unused.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=10m use_temp_path=off;

# Only these routes go through the cache; everything else (index.html, static files) bypasses it.
map $uri $skip_cache {
    default                      1;
    ~^/(allmovies|statistics)$   0;
}

# Cache policy for the CDN/browser. The CRA build hashes asset filenames, so
# /static/ is safe to cache forever; the dataset is read-only, so API answers
# can be cached at the edge (s-maxage = shared caches only, not browsers).
# index.html must always revalidate so new deploys are picked up.
map $uri $cache_control {
    default                      "no-cache";
    ~^/static/                   "public, max-age=31536000, immutable";
    ~^/(allmovies|statistics)$   "public, s-maxage=60";
}

# Request limit of the API, per client address; the static files are not limited (empty key).
# Cached answers count too. Over the limit: 429. Values: API_RATE_LIMIT / API_RATE_BURST (compose).
map $uri $limit_key {
    default                      "";
    ~^/(allmovies|statistics)$   $binary_remote_addr;
}
limit_req_zone $limit_key zone=api_rate:10m rate=${NGINX_API_RATE};

# Skipping the cache on demand (header "X-No-Cache: 1", used by the load tests) makes every request
# reach the app, so it is refused unless ALLOW_CACHE_BYPASS=1.
map "${NGINX_ALLOW_CACHE_BYPASS}:$http_x_no_cache" $client_bypass {
    default 0;
    "1:1"   1;
}

server {
    listen 8080;   # unprivileged port: nginx runs as a non-root user without any capability

    limit_req zone=api_rate burst=${NGINX_API_BURST} nodelay;
    limit_req_status 429;

    # Behind a proxy (the Cloudflare tunnel), every request comes from the proxy's address: take the
    # visitor's address from its header instead, but only from the address range named in
    # TRUSTED_PROXY, since anyone else could forge the header. The default trusts nobody outside.
    set_real_ip_from ${NGINX_TRUSTED_PROXY};
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_min_length 1024;
    # text/javascript AND application/javascript: which one Flask sends for .js depends on the Python
    # version of the image, and a type missing here means the 670 KB bundle is sent uncompressed
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;

    location / {
        set $upstream http://app:5000;
        proxy_pass $upstream;

        proxy_hide_header Cache-Control;
        add_header Cache-Control $cache_control always;

        proxy_cache           api_cache;
        proxy_cache_key       $request_uri;                  # path + query string
        proxy_cache_valid     201 60s;                       # the API answers 201, not 200
        # skip the cache for other routes, and on demand when allowed (see $client_bypass above)
        proxy_cache_bypass    $skip_cache $client_bypass;
        proxy_no_cache        $skip_cache $client_bypass;
        proxy_cache_lock      on;                            # concurrent identical misses -> one backend request
        # serve a stale answer rather than an error if every replica is busy or restarting
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;   # HIT / MISS / BYPASS / STALE

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
        # Retry another replica if one is restarting / unhealthy.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
