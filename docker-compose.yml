# Scalable deployment: nginx (load balancer) -> N stateless Flask/gunicorn replicas.
# The same file works with Docker Compose and with rootless Podman (see the README).
#
#   docker compose up -d --build                 # APP_REPLICAS replicas (default 2)
#   docker compose up -d --scale app=4           # rescale live, no rebuild
#   APP_REPLICAS=4 WEB_CONCURRENCY=2 docker compose up -d
#   podman-compose up -d --build                 # the same with Podman
#
# Open http://localhost:5000 (PORT to change it).
#
# Hardening of every service: non-root user, all Linux capabilities dropped, no-new-privileges.
# app, nginx and db also get a read-only root filesystem; only the tmpfs mounts (and db's
# data volume) are writable. Optional parts: --profile cloudflare, --profile db.
# Optional PostgreSQL warehouse (profile "db"), not used by the web app yet:
#   docker compose --profile db up -d db       # start the database
#   docker compose --profile db run --rm etl   # load movies.csv, then build the star schema with dbt

services:
  app:
    build: .
    image: movie-explorer:latest
    environment:
      MODE: serve
      # gunicorn reads WEB_CONCURRENCY natively (default is 1 worker).
      # Each worker holds its own copy of the movies DataFrame in memory.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Extra gunicorn flags, e.g. "--access-logfile -" to log every request.
      GUNICORN_CMD_ARGS: ${GUNICORN_CMD_ARGS:-}
    # No `ports:` and no `container_name:` -- both would prevent scaling.
    # Replicas are only reachable by nginx through the network's internal DNS.
    expose:
      - "5000"
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m                 # gunicorn's worker files
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Threads count as processes (numpy/pandas start some). The limit is written twice, with the
    # same value, on purpose: Docker Compose refuses `pids_limit` next to `deploy.resources.limits`
    # unless `deploy.resources.limits.pids` matches it, and podman-compose reads either one.
    pids_limit: 512
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      mode: replicated                # podman-compose only reads `replicas` together with this
      replicas: ${APP_REPLICAS:-2}
      resources:
        # No CPU limit on purpose: a rootless Podman refuses to start a container with one
        # unless the cpu cgroup controller is delegated to the user (it usually is not).
        # WEB_CONCURRENCY bounds the CPU use of a replica anyway.
        limits:
          memory: 512M
          pids: 512                   # same as pids_limit above
        reservations:
          memory: 128M

  nginx:
    image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "${PORT:-5000}:8080"
    environment:
      # makes the image export the container's nameserver(s) as NGINX_LOCAL_RESOLVERS,
      # which the template below uses (Docker and Podman do not use the same DNS address)
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      # a template: the image renders it into /etc/nginx/conf.d/default.conf at startup.
      # ":z" relabels the file for SELinux hosts (Fedora, RHEL...) and does nothing elsewhere.
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro,z
    read_only: true
    tmpfs:
      - /tmp:size=64m                 # pid file and temporary files
      - /etc/nginx/conf.d:size=1m,mode=1777   # where the rendered template is written
      # the response cache (proxy_cache_path in nginx.conf, max_size=100m): kept in memory, so
      # it is empty after a restart; the size must stay above max_size
      - /var/cache/nginx:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # Waits for the app container to be started, not healthy: nginx resolves `app` when a
    # request arrives, so it can start first. (Health-based ordering needs systemd timers
    # under rootless Podman, which are not always available.)
    depends_on:
      - app
    restart: unless-stopped

  # Optional: exposes nginx through a Cloudflare Tunnel (no inbound port needed).
  #   CLOUDFLARE_TUNNEL_TOKEN=... docker compose --profile cloudflare up -d
  # In the Cloudflare Zero Trust dashboard, set the tunnel's public hostname
  # service to http://nginx:8080.
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run
    environment:
      # empty default: interpolation runs even when the profile is inactive
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - nginx
    restart: unless-stopped

  # Optional: PostgreSQL holding the movies as a star schema (built by dbt, see dbt/).
  # Published on localhost only: it can be inspected with psql but not reached from outside.
  db:
    image: docker.io/library/postgres:17-alpine
    profiles: ["db"]
    # Runs as the image's own unprivileged "postgres" user (uid 70 in the alpine image) instead of
    # starting as root and dropping privileges. If you already have a `pgdata` volume created by an
    # older setup it is owned by that same user, so nothing to change.
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movies}   # change it (.env) for anything but local use
      POSTGRES_DB: ${POSTGRES_DB:-movies}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /var/run/postgresql:size=1m,mode=1777   # unix socket and pid file
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512                   # one process per connection, plus a few background ones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot pipeline, safe to re-run:
  #   1. python loads movies.csv into raw.movies (one transaction)
  #   2. dbt builds and tests the star schema from it (etl/run.sh)
  # Own image (etl/Dockerfile): dbt does not belong in the web app image.
  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    image: movie-explorer-etl:latest
    profiles: ["db"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-movies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movies}
      POSTGRES_DB: ${POSTGRES_DB:-movies}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # Waits for the db container to be started, not healthy (health-based ordering needs systemd
    # timers under rootless Podman): the loader retries its connection for about a minute.
    depends_on:
      - db
    restart: "no"

volumes:
  pgdata:
