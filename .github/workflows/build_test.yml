# Exemple minimal d'un workflow
name: Tests

on:
  push:
     branches:
      - dev
      - master

  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
    branches:
      - dev
      - master


jobs:
  unit-tests-frontend:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: execute test
        run: |
          cd frontend
          npm ci
          npm test
  
  integration-tests-frontend:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
  #         # Install a specific version of uv.
           version: "0.11.28"
      
      - name: integration test linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
            uv venv --python 3.12
            source .venv/bin/activate
            uv pip install -r requirements.txt
            cd frontend
            npm ci
            npm run build
            npx playwright install --with-deps
            npx playwright test
        env:
          CI: false

  tests-backend:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Run backend tests
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv run -m pytest

  stress-test:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Run backend stress test
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r requirements.txt
          uv run gunicorn --bind 0.0.0.0:5000 backend.wsgi:app &
          sleep 5
          uv run locust -f backend/performance/locustfile.py --host=http://localhost:5000 --headless -u 100 -t 2m

