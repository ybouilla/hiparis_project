# minimal test workflow
name: Tests

on:
  push:
     branches:
      - dev
      - master

  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
    branches:
      - dev
      - master


jobs:
  unit-tests-frontend:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: execute test
        run: |
          cd frontend
          npm ci
          npm test
  
  integration-tests-frontend:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
  #         # Install a specific version of uv.
           version: "0.11.28"
      
      - name: integration test linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
            uv venv --python 3.12
            source .venv/bin/activate
            uv pip install -r requirements.txt
            cd frontend
            npm ci
            npm run build
            npx playwright install --with-deps
            npx playwright test
        env:
          CI: false

  tests-backend:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Run backend tests
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv run -m pytest

  stress-test:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Run backend stress test
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r requirements.txt
          uv run gunicorn --bind 0.0.0.0:5000 backend.wsgi:app &
          sleep 5
          uv run locust -f backend/performance/locustfile.py --host=http://localhost:5000 --headless -u 100 -t 2m

  docker-test:
    strategy:
      matrix:
        os:
          - ubuntu-24.04

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t webserver .

      - name: Run container
        run: docker run -d -it  --name webserver -e MODE=serve -p 5000:5000 webserver 

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Run backend stress test with docker
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install locust
          sleep 5
          uv run locust -f backend/performance/locustfile.py --host=http://localhost:5000 --headless -u 100 -t 2m
          sleep 5
      
      - name: clean up and run test through docker
        run: | 
          docker rm -f webserver
          docker run -d -it --name webserver -e MODE=test -p 5000:5000 webserver

      - name: clean up
        run: docker rm -f webserver

  scalability-test:
    # Load test through nginx with several app replicas, then check that
    # (1) scaling up live is picked up and (2) every replica served traffic.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Start stack with 2 replicas
        env:
          APP_REPLICAS: 2
          GUNICORN_CMD_ARGS: "--access-logfile -"
        run: docker compose up -d --build --wait

      - name: Scale up to 4 replicas live
        env:
          GUNICORN_CMD_ARGS: "--access-logfile -"
        run: |
          docker compose up -d --scale app=4 --no-recreate --wait
          # nginx re-resolves the `app` DNS name every 5s
          sleep 10
          test "$(docker compose ps -q app | wc -l)" -eq 4

      - name: Load test through nginx
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install locust
          # locust exits non-zero if any request failed
          uv run locust -f backend/performance/locustfile.py --host=http://localhost:5000 \
            --headless -u 100 -t 1m --html scalability-report.html

      - name: Check load was spread across all replicas
        run: |
          for id in $(docker compose ps -q app); do
            n=$(docker logs "$id" 2>&1 | grep -c "GET /allmovies" || true)
            echo "replica ${id:0:12}: $n requests"
            test "$n" -gt 0
          done

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalability-report
          path: scalability-report.html

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Clean up
        if: always()
        run: docker compose down -v

  cloudflare-test:
    # Same load test, but through a real Cloudflare Tunnel + public hostname.
    # Needs repo secret CLOUDFLARE_TUNNEL_TOKEN and repo variable CLOUDFLARE_URL
    # (e.g. https://movies.example.com). Skipped when they are not set, and on
    # PRs from forks (no access to secrets).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare configuration
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          URL: ${{ vars.CLOUDFLARE_URL }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_TUNNEL_TOKEN / CLOUDFLARE_URL not set, skipping Cloudflare test"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.cf.outputs.enabled == 'true'
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        if: steps.cf.outputs.enabled == 'true'
        with:
          version: "0.11.28"

      - name: Start stack with Cloudflare Tunnel
        if: steps.cf.outputs.enabled == 'true'
        env:
          APP_REPLICAS: 4
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: docker compose --profile cloudflare up -d --build --wait

      - name: Wait for the public hostname
        if: steps.cf.outputs.enabled == 'true'
        run: curl -fsS --retry 20 --retry-delay 3 --retry-all-errors -o /dev/null "${{ vars.CLOUDFLARE_URL }}/"

      - name: Report edge cache status
        if: steps.cf.outputs.enabled == 'true'
        run: |
          # informational: HIT only if a Cache Rule makes /allmovies cacheable
          for i in 1 2; do
            curl -sS -D - -o /dev/null "${{ vars.CLOUDFLARE_URL }}/allmovies" | grep -i -E "^(HTTP|cf-cache-status)" || true
          done

      - name: Load test through Cloudflare
        if: steps.cf.outputs.enabled == 'true'
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install locust
          # fewer users than the local test: Cloudflare may rate-limit / challenge a burst from one IP
          uv run locust -f backend/performance/locustfile.py --host="${{ vars.CLOUDFLARE_URL }}" \
            --headless -u 50 -t 1m --html cloudflare-report.html

      - name: Upload report
        if: always() && steps.cf.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-report
          path: cloudflare-report.html

      - name: Clean up
        if: always() && steps.cf.outputs.enabled == 'true'
        run: docker compose --profile cloudflare down -v

  cloudflare-quick-tunnel-test:
    # Same load test through a throwaway https://<random>.trycloudflare.com tunnel.
    # No Cloudflare account, secret or domain needed. It checks that the app is
    # reachable and load-balanced through Cloudflare's network, but not your zone's
    # cache rules / WAF (see cloudflare-test for that).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Start stack with 4 replicas
        env:
          APP_REPLICAS: 4
          GUNICORN_CMD_ARGS: "--access-logfile -"
        run: docker compose up -d --build --wait

      - name: Open quick tunnel to nginx
        run: |
          # host network: reach nginx on the port compose publishes (5000).
          # http2 instead of the default QUIC, in case UDP is filtered.
          docker run -d --name cf-quick --network host cloudflare/cloudflared:latest \
            tunnel --no-autoupdate --protocol http2 --url http://localhost:5000
          for i in $(seq 1 30); do
            url=$(docker logs cf-quick 2>&1 | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | head -1 || true)
            [ -n "$url" ] && break
            sleep 2
          done
          test -n "$url" || { echo "::error::no trycloudflare URL found"; docker logs cf-quick; exit 1; }
          echo "Tunnel URL: $url"
          echo "TUNNEL_URL=$url" >> "$GITHUB_ENV"

      - name: Wait for the public hostname
        # DNS for a fresh trycloudflare hostname can take several seconds to appear
        run: curl -fsS --retry 30 --retry-delay 3 --retry-all-errors -o /dev/null "$TUNNEL_URL/"

      - name: Load test through the quick tunnel
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install locust
          uv run locust -f backend/performance/locustfile.py --host="$TUNNEL_URL" \
            --headless -u 50 -t 1m --html quick-tunnel-report.html

      - name: Check load was spread across all replicas
        run: |
          for id in $(docker compose ps -q app); do
            n=$(docker logs "$id" 2>&1 | grep -c "GET /allmovies" || true)
            echo "replica ${id:0:12}: $n requests"
            test "$n" -gt 0
          done

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-tunnel-report
          path: quick-tunnel-report.html

      - name: Logs on failure
        if: failure()
        run: |
          docker logs cf-quick --tail=50 || true
          docker compose logs --tail=100

      - name: Clean up
        if: always()
        run: |
          docker rm -f cf-quick || true
          docker compose down -v
