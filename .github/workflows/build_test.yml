# minimal test workflow
name: Tests

on:
  push:
     branches:
      - dev
      - master

  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
    branches:
      - dev
      - master


jobs:
  unit-tests-frontend:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: execute test
        # bash (also on Windows) stops at the first failing command; the default
        # PowerShell carries on after a failed `npm ci` and then reports a
        # misleading "'react-scripts' is not recognized".
        shell: bash
        run: |
          cd frontend
          npm ci
          npm test

      - name: npm debug log on failure
        if: failure()
        shell: bash
        run: tail -n 100 "$(npm config get cache)"/_logs/*.log || true

  integration-tests-frontend:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
  #         # Install a specific version of uv.
           version: "0.11.28"
      
      - name: integration test linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
            uv venv
            source .venv/bin/activate
            uv pip install -r requirements.txt
            cd frontend
            npm ci
            npm run build
            npx playwright install --with-deps
            npx playwright test
        env:
          CI: false

  tests-backend:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Run backend tests
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv run -m pytest

  stress-test:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Run backend stress test
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -r requirements.txt
          uv run gunicorn --bind 0.0.0.0:5000 backend.wsgi:app &
          sleep 5
          uv run locust -f backend/performance/locustfile.py --host=http://localhost:5000 --headless -u 100 -t 2m

  docker-test:
    # Tests the Docker image itself: its built-in test mode, then the running container
    # (what it serves, how it runs), then a load test against it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t webserver .

      - name: Run the tests inside the image (MODE=test)
        # in the foreground, and `docker run` returns pytest's exit code: a failing test fails the job
        run: docker run --rm -e MODE=test webserver

      - name: Start the container (MODE=serve)
        run: docker run -d --name webserver -e MODE=serve -p 5000:5000 webserver

      - name: Wait for the server
        run: curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null "http://localhost:5000/allmovies?start=0&end=1"

      - name: Smoke test the running container
        run: |
          set -e
          base=http://localhost:5000

          # the React build is in the image and served at /, with its JavaScript (name taken from index.html)
          page=$(curl -fsS "$base/")
          echo "$page" | grep -q '<div id="root">'
          js=$(echo "$page" | grep -o '/static/js/main\.[A-Za-z0-9]*\.js' | head -1)
          test -n "$js"
          curl -fsS -o /dev/null "$base$js"

          # the API answers 201 with the expected JSON
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/allmovies?start=0&end=20")" = "201"
          curl -fsS "$base/statistics" | grep -q '"stats_genre"'

          # filters and sorting are really applied, not just any answer returned
          curl -fsS "$base/allmovies?start=0&end=20&lang=ja&order_by=vote_count&order_desc=desc" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          movies = data["movies"]
          assert movies and all(m["Original_Language"] == "ja" for m in movies), "the language filter is not applied"
          counts = [m["Vote_Count"] for m in movies]
          assert counts == sorted(counts, reverse=True), "the sort is not applied"
          assert data["total_movies"] > 100
          '

          # the in-process cache works (one worker: the same URL is computed, then served from memory)
          url="$base/allmovies?start=0&end=20&genre=Western"
          layer() { curl -s -D - -o /dev/null "$url" | tr -d '\r' | grep -i '^x-app-cache' | awk '{print $2}'; }
          first=$(layer); second=$(layer)
          echo "X-App-Cache: first=$first second=$second"
          test "$first" = "miss"; test "$second" = "memory"

          # the container is unprivileged and gunicorn uses the threaded workers of gunicorn.conf.py
          test "$(docker exec webserver id -u)" = "10001"
          docker logs webserver 2>&1 | grep -q 'Using worker: gthread'

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Load test the container
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install locust
          # locust exits non-zero if any request failed
          uv run locust -f backend/performance/locustfile.py --host=http://localhost:5000 --headless -u 100 -t 2m

      - name: Container logs on failure
        if: failure()
        run: docker logs webserver || true

      - name: Clean up
        if: always()
        run: docker rm -f webserver

  scalability-test:
    # Load test through nginx with several app replicas, then check that
    # (1) scaling up live is picked up and (2) every replica served traffic.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Start stack with 2 replicas
        env:
          APP_REPLICAS: 2
          GUNICORN_CMD_ARGS: "--access-logfile -"
        run: docker compose up -d --build --wait

      - name: Scale up to 4 replicas live
        env:
          GUNICORN_CMD_ARGS: "--access-logfile -"
        run: |
          docker compose up -d --scale app=4 --no-recreate --wait
          # nginx re-resolves the `app` DNS name every 5s
          sleep 10
          test "$(docker compose ps -q app | wc -l)" -eq 4

      - name: nginx caches repeated API requests
        run: |
          url="http://localhost:5000/statistics?dates=1990&dates=2020"
          status() { curl -s -D - -o /dev/null "$@" | tr -d '\r' | grep -i '^x-cache-status' | awk '{print $2}'; }
          first=$(status "$url"); second=$(status "$url"); bypass=$(status -H 'X-No-Cache: 1' "$url")
          echo "first=$first second=$second with X-No-Cache=$bypass"
          test "$first" = "MISS"; test "$second" = "HIT"; test "$bypass" = "BYPASS"

      - name: memcached shares answers between the replicas
        run: |
          # X-No-Cache skips nginx's cache, so the requests reach the app. The same URL 16 times: one
          # worker computes the answer (miss), the others must find it in memcached.
          url="http://localhost:5000/allmovies?start=0&end=20&genre=Thriller&order_by=vote_count"
          for i in $(seq 1 16); do
            curl -s -D - -o /dev/null -H 'X-No-Cache: 1' "$url" | tr -d '\r' | grep -i '^x-app-cache' | awk '{print $2}'
          done | sort | uniq -c | tee layers.txt
          grep -qw miss layers.txt
          grep -qw memcached layers.txt

      - name: Load test through nginx
        env:
          NO_CACHE: 1   # every request must reach a replica, so the per-replica check below is meaningful
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install locust
          # locust exits non-zero if any request failed
          uv run locust -f backend/performance/locustfile.py --host=http://localhost:5000 \
            --headless -u 100 -t 1m --html scalability-report.html

      - name: Check load was spread across all replicas
        run: |
          for id in $(docker compose ps -q app); do
            n=$(docker logs "$id" 2>&1 | grep -c "GET /allmovies" || true)
            echo "replica ${id:0:12}: $n requests"
            test "$n" -gt 0
          done

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalability-report
          path: scalability-report.html

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Clean up
        if: always()
        run: docker compose down -v

  cloudflare-test:
    # Same load test, but through a real Cloudflare Tunnel + public hostname.
    # Needs repo secret CLOUDFLARE_TUNNEL_TOKEN and repo variable CLOUDFLARE_URL
    # (e.g. https://movies.example.com). Skipped when they are not set, and on
    # PRs from forks (no access to secrets).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare configuration
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          URL: ${{ vars.CLOUDFLARE_URL }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_TUNNEL_TOKEN / CLOUDFLARE_URL not set, skipping Cloudflare test"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.cf.outputs.enabled == 'true'
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        if: steps.cf.outputs.enabled == 'true'
        with:
          version: "0.11.28"

      - name: Start stack with Cloudflare Tunnel
        if: steps.cf.outputs.enabled == 'true'
        env:
          APP_REPLICAS: 4
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: docker compose --profile cloudflare up -d --build --wait

      - name: Wait for the public hostname
        if: steps.cf.outputs.enabled == 'true'
        run: curl -fsS --retry 20 --retry-delay 3 --retry-all-errors -o /dev/null "${{ vars.CLOUDFLARE_URL }}/"

      - name: Report edge cache status
        if: steps.cf.outputs.enabled == 'true'
        run: |
          # informational: HIT only if a Cache Rule makes /allmovies cacheable
          for i in 1 2; do
            curl -sS -D - -o /dev/null "${{ vars.CLOUDFLARE_URL }}/allmovies" | grep -i -E "^(HTTP|cf-cache-status)" || true
          done

      - name: Load test through Cloudflare
        if: steps.cf.outputs.enabled == 'true'
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install locust
          # fewer users than the local test: Cloudflare may rate-limit / challenge a burst from one IP
          uv run locust -f backend/performance/locustfile.py --host="${{ vars.CLOUDFLARE_URL }}" \
            --headless -u 50 -t 1m --html cloudflare-report.html

      - name: Upload report
        if: always() && steps.cf.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-report
          path: cloudflare-report.html

      - name: Clean up
        if: always() && steps.cf.outputs.enabled == 'true'
        run: docker compose --profile cloudflare down -v

  cloudflare-quick-tunnel-test:
    # Same load test through a throwaway https://<random>.trycloudflare.com tunnel.
    # No Cloudflare account, secret or domain needed. It checks that the app is
    # reachable and load-balanced through Cloudflare's network, but not your zone's
    # cache rules / WAF (see cloudflare-test for that).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Start stack with 4 replicas
        env:
          APP_REPLICAS: 4
          GUNICORN_CMD_ARGS: "--access-logfile -"
        run: docker compose up -d --build --wait

      - name: Open quick tunnel to nginx
        id: tunnel
        # Cloudflare rate-limits account-less tunnels (HTTP 429), often on GitHub's shared runner IPs,
        # and gives no uptime guarantee. So: retry with a growing pause, and if Cloudflare still refuses,
        # skip the rest of this job with a warning instead of failing the pull request for a third party.
        run: |
          url=""
          for attempt in 1 2 3 4 5; do
            docker rm -f cf-quick >/dev/null 2>&1 || true
            # host network: reach nginx on the port compose publishes (5000).
            # http2 instead of the default QUIC, in case UDP is filtered.
            docker run -d --name cf-quick --network host cloudflare/cloudflared:latest \
              tunnel --no-autoupdate --protocol http2 --url http://localhost:5000 >/dev/null
            for i in $(seq 1 15); do
              url=$(docker logs cf-quick 2>&1 | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | head -1 || true)
              [ -n "$url" ] && break
              docker logs cf-quick 2>&1 | grep -q 'provisioning failed' && break
              sleep 2
            done
            [ -n "$url" ] && break
            echo "attempt $attempt: no tunnel ($(docker logs cf-quick 2>&1 | grep -o 'provisioning failed.*' | head -1))"
            sleep $((attempt * 20))
          done
          if [ -n "$url" ]; then
            echo "Tunnel URL: $url"
            echo "TUNNEL_URL=$url" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare did not give a quick tunnel after 5 attempts (rate limit): the tunnel test is skipped"
            docker logs cf-quick 2>&1 | tail -5
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the public hostname
        id: hostname
        if: steps.tunnel.outputs.available == 'true'
        # The DNS record of a fresh trycloudflare hostname takes a while to appear. Asking the runner's
        # resolver too early makes it remember "no such host" far longer than our retries last. So: ask
        # the domain's own name server until the record exists, then pin the address in /etc/hosts
        # (used by curl and by Locust). If Cloudflare never publishes it, skip with a warning, as above.
        run: |
          host=${TUNNEL_URL#https://}
          ns=$(dig +short NS trycloudflare.com | head -1)
          ip=""
          for i in $(seq 1 60); do
            ip=$(dig +short A "$host" ${ns:+"@$ns"} | grep -E '^[0-9]+(\.[0-9]+){3}$' | head -1 || true)
            [ -n "$ip" ] && break
            sleep 3
          done
          if [ -z "$ip" ]; then
            echo "::warning::Cloudflare never published the DNS record of $host: the tunnel test is skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ip $host" | sudo tee -a /etc/hosts
          # the record exists; the edge may still need a moment to route to the tunnel
          curl -fsS --retry 30 --retry-delay 3 --retry-all-errors -o /dev/null "$TUNNEL_URL/"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Load test through the quick tunnel
        if: steps.hostname.outputs.available == 'true'
        env:
          NO_CACHE: 1   # bypass nginx's cache so every replica gets requests
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install locust
          set -o pipefail
          # locust itself does not fail on request errors: the next command decides, because a few
          # Cloudflare 530 answers (tunnel unreachable for a moment) are not a failure of the app
          uv run locust -f backend/performance/locustfile.py --host="$TUNNEL_URL" \
            --headless -u 50 -t 1m --html quick-tunnel-report.html --csv=tunnel --exit-code-on-error 0
          python scripts/check_tunnel_failures.py tunnel --max-percent 5 | tee tunnel-check.txt
          if grep -q '::warning::' tunnel-check.txt; then
            echo "=== cloudflared log: why was the tunnel unreachable?"
            docker logs cf-quick 2>&1 | grep -E ' (ERR|WRN) ' | tail -20 || true
          fi

      - name: Check load was spread across all replicas
        if: steps.hostname.outputs.available == 'true'
        run: |
          for id in $(docker compose ps -q app); do
            n=$(docker logs "$id" 2>&1 | grep -c "GET /allmovies" || true)
            echo "replica ${id:0:12}: $n requests"
            test "$n" -gt 0
          done

      - name: Upload report
        if: always() && steps.hostname.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quick-tunnel-report
          path: quick-tunnel-report.html

      - name: Logs on failure
        if: failure()
        run: |
          docker logs cf-quick --tail=50 || true
          docker compose logs --tail=100

      - name: Clean up
        if: always()
        run: |
          docker rm -f cf-quick || true
          docker compose down -v

  podman-test:
    # The same stack with rootless Podman + podman-compose: checks that it starts, serves the
    # API through nginx and that the containers really run unprivileged.
    # continue-on-error: this job has not run on a real runner yet (rootless Podman depends on
    # the runner's user namespaces and DNS plugin). Remove the line once it is green.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install podman-compose
        run: pipx install podman-compose==1.6.0

      - name: Podman is rootless
        run: |
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = "true"

      - name: Build and start the stack (2 replicas)
        run: podman-compose up -d --build

      - name: Wait for the app through nginx
        run: curl -fsS --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:5000/

      - name: nginx caches repeated API requests (cache directory is a tmpfs of a read-only container)
        run: |
          url="http://localhost:5000/statistics?dates=1990&dates=2020"
          status() { curl -s -D - -o /dev/null "$@" | tr -d '\r' | grep -i '^x-cache-status' | awk '{print $2}'; }
          first=$(status "$url"); second=$(status "$url"); bypass=$(status -H 'X-No-Cache: 1' "$url")
          echo "first=$first second=$second with X-No-Cache=$bypass"
          test "$first" = "MISS"; test "$second" = "HIT"; test "$bypass" = "BYPASS"

      - name: memcached shares answers between the replicas
        run: |
          url="http://localhost:5000/allmovies?start=0&end=20&genre=Thriller&order_by=vote_count"
          for i in $(seq 1 16); do
            curl -s -D - -o /dev/null -H 'X-No-Cache: 1' "$url" | tr -d '\r' | grep -i '^x-app-cache' | awk '{print $2}'
          done | sort | uniq -c | tee layers.txt
          grep -qw miss layers.txt
          grep -qw memcached layers.txt

      - name: API answers and containers are unprivileged
        run: |
          curl -fsS "http://localhost:5000/allmovies?start=0&end=1" | grep -q '"movies"'
          curl -fsS "http://localhost:5000/statistics" | grep -q 'stats_genre'
          test "$(podman ps --filter label=io.podman.compose.service=app -q | wc -l)" -eq 2
          for service in app nginx; do
            for container in $(podman ps --filter "label=io.podman.compose.service=$service" --format '{{.Names}}'); do
              uid=$(podman exec "$container" id -u)
              echo "$service ($container) runs as uid $uid"
              test "$uid" != "0"
            done
          done

      - name: Logs on failure
        if: failure()
        run: |
          podman ps -a
          podman-compose logs --tail=60

      - name: Clean up
        if: always()
        run: podman-compose down -v

  podman-db-test:
    # The optional database profile with rootless Podman: PostgreSQL (non-root, read-only) and the
    # pipeline image (python + dbt) loading the CSV and building the star schema.
    # continue-on-error: not run on a real runner yet, like podman-test. Remove it once green.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install podman-compose
        run: pipx install podman-compose==1.6.0

      - name: Start PostgreSQL
        run: podman-compose --profile db up -d db

      - name: Build the pipeline image
        run: podman-compose --profile db build etl

      - name: Run the pipeline (load raw.movies, then dbt build and tests)
        run: podman-compose --profile db run --rm etl

      - name: Check the warehouse and that PostgreSQL is unprivileged
        run: |
          db=$(podman ps --filter label=io.podman.compose.service=db --format '{{.Names}}')
          test -n "$db"
          test "$(podman exec "$db" id -u)" = "70"
          test "$(podman exec "$db" psql -U movies -d movies -Atc 'SELECT count(*) FROM vw_movies')" -gt 9000
          podman exec "$db" psql -U movies -d movies -c "SELECT g.genre_name, count(*) AS movies FROM bridge_movie_genre b JOIN dim_genre g USING (genre_key) GROUP BY 1 ORDER BY 2 DESC LIMIT 3"

      - name: Logs on failure
        if: failure()
        run: |
          podman ps -a
          podman-compose --profile db logs --tail=60

      - name: Clean up
        if: always()
        run: podman-compose --profile db down -v

  etl-test:
    # CSV -> PostgreSQL star schema, against a real PostgreSQL service container.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: movies
          POSTGRES_PASSWORD: movies
          POSTGRES_DB: movies
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movies -d movies"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Install dependencies (python loader + dbt)
        run: |
          uv venv
          uv pip install -r requirements.txt -r etl/requirements.txt pytest==9.1.1

      - name: Loader tests (repeatable, atomic load of raw.movies)
        env:
          TEST_DATABASE_URL: postgresql://movies:movies@localhost:5432/movies
        run: uv run -m pytest etl/tests -v

      - name: Run the pipeline twice (load raw, then dbt build + dbt tests)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: movies
          POSTGRES_PASSWORD: movies
          POSTGRES_DB: movies
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
        run: |
          uv run sh etl/run.sh
          uv run sh etl/run.sh   # the second run replaces tables that foreign keys point to

      - name: The website's data source (backend/store.py) gives the same answers as the CSV
        env:
          TEST_DATABASE_URL: postgresql://movies:movies@localhost:5432/movies
        run: uv run -m pytest backend/tests/test_store.py -v

      - name: Query the warehouse
        env:
          DATABASE_URL: postgresql://movies:movies@localhost:5432/movies
        run: |
          test "$(psql "$DATABASE_URL" -Atc 'SELECT count(*) FROM vw_movies')" -gt 9000
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_constraint WHERE contype = 'f' AND connamespace = 'public'::regnamespace")" -eq 5
          psql "$DATABASE_URL" -c "SELECT g.genre_name, count(*) AS movies FROM bridge_movie_genre b JOIN dim_genre g USING (genre_key) GROUP BY 1 ORDER BY 2 DESC LIMIT 3"

  local-db-test:
    # The Docker-free setup: scripts/localdb.sh starts a private PostgreSQL (the server programs
    # that come preinstalled on the runner), then the normal pipeline runs against it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Install dependencies (python loader + dbt)
        run: |
          uv venv
          uv pip install -r etl/requirements.txt

      - name: Start the local database
        run: |
          scripts/localdb.sh start
          scripts/localdb.sh status

      - name: Run the pipeline against it
        env:
          POSTGRES_HOST: 127.0.0.1
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
        run: uv run sh etl/run.sh

      - name: Query the warehouse
        run: test "$(scripts/localdb.sh psql -Atc 'SELECT count(*) FROM vw_movies')" -gt 9000

      - name: Stop the local database
        if: always()
        run: scripts/localdb.sh stop

  local-cache-test:
    # The Docker-free setup: memcached installed with apt and started by scripts/localcache.sh, the
    # app run locally with gunicorn (2 workers). The workers must share their answers through it.
    runs-on: ubuntu-24.04
    env:
      MEMCACHED_PORT: "11311"   # not 11211: the apt package also starts a system memcached there
      WEB_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Install memcached and the app's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y memcached
          uv venv
          uv pip install -r requirements.txt

      - name: Start memcached with the script
        run: |
          scripts/localcache.sh start
          scripts/localcache.sh status

      - name: Run the app on top of it and check that the workers share their answers
        run: |
          source .venv/bin/activate
          scripts/localcache.sh run gunicorn --bind 127.0.0.1:5000 --daemon --pid gunicorn.pid backend.wsgi:app
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors -o /dev/null "http://127.0.0.1:5000/allmovies?start=0&end=1"
          # the same URL 16 times: one worker computes the answer (miss), the other must find it in memcached
          url="http://127.0.0.1:5000/allmovies?start=0&end=20&genre=Thriller&order_by=vote_count"
          for i in $(seq 1 16); do
            curl -s -D - -o /dev/null "$url" | tr -d '\r' | grep -i '^x-app-cache' | awk '{print $2}'
          done | sort | uniq -c | tee layers.txt
          grep -qw miss layers.txt
          grep -qw memcached layers.txt
          scripts/localcache.sh stats | tee stats.txt
          grep -Eq 'items +[1-9]' stats.txt

      - name: Flush and stop
        if: always()
        run: |
          scripts/localcache.sh flush || true
          kill "$(cat gunicorn.pid)" 2>/dev/null || true
          scripts/localcache.sh stop

  lighthouse-test:
    # Lighthouse CI on the whole stack (nginx with compression and cache headers, as in production):
    # a performance / accessibility / best-practices report, and a hard limit on the JavaScript
    # downloaded (frontend/lighthouserc.json). The report goes to the job summary, to an artifact
    # and, on pull requests, to a comment.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write   # to post the report as a comment on the pull request
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start the whole stack (nginx in front of the app)
        run: docker compose up -d --build --wait

      - name: nginx compresses the JavaScript
        # the Lighthouse size limit assumes it: if a file type is missing from gzip_types the bundle is
        # sent uncompressed (670 KB instead of about 240 KB), and this says so directly
        run: |
          js=$(curl -s http://localhost:5000/ | grep -o '/static/js/main\.[A-Za-z0-9]*\.js' | head -1)
          test -n "$js"
          headers=$(curl -s -D - -o /dev/null -H 'Accept-Encoding: gzip' "http://localhost:5000$js" | tr -d '\r')
          echo "$headers" | grep -i -E '^(content-type|content-encoding|content-length)'
          echo "$headers" | grep -qi '^content-encoding: gzip' || { echo "::error::$js is not gzip-compressed: add its Content-Type to gzip_types in nginx/nginx.conf"; exit 1; }

      - name: Lighthouse CI
        id: lhci
        continue-on-error: true   # the report below is produced even when a budget check fails
        run: npx --yes @lhci/cli@0.16.1 autorun --config=frontend/lighthouserc.json

      - name: Build the report
        if: always()
        run: python3 scripts/lighthouse_summary.py

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci
            lighthouse-summary.md

      - name: Post the report on the pull request
        # not for pull requests from forks: their token cannot write comments
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lighthouse-report -->';
            const body = marker + '\n' + fs.readFileSync('lighthouse-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const previous = comments.find((c) => c.body && c.body.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if a Lighthouse budget check failed
        if: steps.lhci.outcome == 'failure'
        run: |
          echo "A Lighthouse check of frontend/lighthouserc.json failed: see the report above."
          exit 1

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=60

      - name: Clean up
        if: always()
        run: docker compose down -v

  website-database-test:
    # The website on top of the database, in containers: PostgreSQL and the pipeline build the
    # warehouse, the app answers from it (DATA_SOURCE=postgres), then the database is stopped to
    # see what the website does, and started again.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the warehouse (PostgreSQL + pipeline)
        run: |
          docker compose --profile db up -d db
          docker compose --profile db run --rm etl

      - name: Start the website on the database
        env:
          DATA_SOURCE: postgres
          APP_REPLICAS: 2
        run: docker compose up -d --build --wait app nginx

      - name: The answers come from PostgreSQL and are right
        run: |
          set -e
          base=http://localhost:5000
          source_of() { curl -s -D - -o /dev/null -H 'X-No-Cache: 1' "$1" | tr -d '\r' | grep -i '^x-data-source' | awk '{print $2}'; }
          test "$(source_of "$base/allmovies?start=0&end=20")" = "postgres"
          curl -fsS -H 'X-No-Cache: 1' "$base/allmovies?start=0&end=20&lang=ja&order_by=vote_count&order_desc=desc" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          movies = data["movies"]
          assert movies and all(m["Original_Language"] == "ja" for m in movies), "the language filter is not applied"
          counts = [m["Vote_Count"] for m in movies]
          assert counts == sorted(counts, reverse=True), "the sort is not applied"
          assert data["total_movies"] > 100 and len(data["all_genres"]) >= 15
          '
          curl -fsS -H 'X-No-Cache: 1' "$base/statistics?dates=1990&dates=2000" | grep -q '"stats_genre"'

      - name: With the database stopped, the website says so
        run: |
          docker compose --profile db stop db
          # a URL nobody asked for yet, so that no cache can answer it
          code=$(curl -s -o body.json -w '%{http_code}' -H 'X-No-Cache: 1' "http://localhost:5000/allmovies?start=0&end=7&genre=Western&order_by=vote_average")
          echo "HTTP $code: $(cat body.json)"
          test "$code" = "503"
          grep -qi 'database' body.json

      - name: Started again, it answers again
        run: |
          docker compose --profile db start db
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors -H 'X-No-Cache: 1' -o /dev/null \
            "http://localhost:5000/allmovies?start=0&end=7&genre=Western&order_by=vote_average"

      - name: Logs on failure
        if: failure()
        run: docker compose --profile db logs --tail=60

      - name: Clean up
        if: always()
        run: docker compose --profile db down -v

  gvisor-test:
    # The optional gVisor sandbox (docker-compose.gvisor.yml): install gVisor, check that the web-facing
    # containers really run in it, smoke-test them, and load-test the plain and the sandboxed stack the
    # same way so that the cost of the isolation shows in the job summary.
    # continue-on-error: this job has not run on a real runner yet. Remove it once green.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Install gVisor and register it as a Docker runtime
        # the official instructions: https://gvisor.dev/docs/user_guide/install/
        # two runtimes: runsc (gVisor's own network stack) and runsc-hostnet (the host's network stack,
        # needed here: Docker's built-in DNS, which finds the services by name, does not work with the first)
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo runsc install --runtime runsc-hostnet -- --network=host
          sudo systemctl restart docker
          runsc --version | head -1

      - name: gVisor works (a throw-away container sees gVisor's kernel, not the host's)
        # not `dmesg`: reading the kernel log is "Operation not permitted" without extra privileges
        run: |
          host_kernel=$(uname -r)
          for runtime in runsc runsc-hostnet; do
            sandbox_kernel=$(docker run --rm --runtime="$runtime" docker.io/library/alpine:3 uname -r)
            echo "$runtime: kernel seen in the container: $sandbox_kernel (host: $host_kernel)"
            test -n "$sandbox_kernel"
            test "$sandbox_kernel" != "$host_kernel"
          done

      - name: Install the load-test tool
        run: |
          uv venv --python 3.12
          uv pip install locust

      - name: Load test the plain stack (the reference)
        env:
          NO_CACHE: 1
        run: |
          docker compose up -d --build --wait
          uv run locust -f backend/performance/locustfile.py --host=http://localhost:5000 \
            --headless -u 50 -t 40s --csv=plain
          docker compose down -v

      - name: Start the sandboxed stack
        run: docker compose -f docker-compose.yml -f docker-compose.gvisor.yml up -d --build --wait

      - name: The containers really run in gVisor, and work
        run: |
          set -e
          for service in app nginx memcached; do
            id=$(docker compose ps -q "$service" | head -1)
            runtime=$(docker inspect -f '{{.HostConfig.Runtime}}' "$id")
            echo "$service: runtime=$runtime"
            test "$runtime" = "runsc-hostnet"
          done
          # gVisor answers for its own kernel: not the host's version
          host_kernel=$(uname -r)
          sandbox_kernel=$(docker exec "$(docker compose ps -q app | head -1)" uname -r)
          echo "host kernel: $host_kernel, kernel seen by the app: $sandbox_kernel"
          test "$sandbox_kernel" != "$host_kernel"
          # and the site works: API, nginx cache, in-process cache
          base=http://localhost:5000
          curl -fsS "$base/allmovies?start=0&end=5" | grep -q '"movies"'
          url="$base/statistics?dates=1990&dates=2000"
          status() { curl -s -D - -o /dev/null "$@" | tr -d '\r' | grep -i '^x-cache-status' | awk '{print $2}'; }
          test "$(status "$url")" = "MISS"; test "$(status "$url")" = "HIT"

      - name: Load test the sandboxed stack
        env:
          NO_CACHE: 1
        run: |
          uv run locust -f backend/performance/locustfile.py --host=http://localhost:5000 \
            --headless -u 50 -t 40s --csv=gvisor

      - name: What the isolation costs
        if: always()
        run: |
          python3 - <<'PY' | tee cost.md
          import csv, os
          def row(prefix):
              path = f"{prefix}_stats.csv"
              if not os.path.exists(path):
                  return None
              return next(r for r in csv.DictReader(open(path)) if r["Name"] == "Aggregated")
          plain, sandbox = row("plain"), row("gvisor")
          print("### gVisor: what the isolation costs (50 users, 40 s, nginx cache bypassed)\n")
          print("| | requests/s | median (ms) | 95th percentile (ms) | failures |\n|---|---|---|---|---|")
          for name, r in (("plain (runc)", plain), ("gVisor (runsc)", sandbox)):
              if r:
                  print(f"| {name} | {float(r['Requests/s']):.1f} | {r['50%']} | {r['95%']} | {r['Failure Count']} |")
          if plain and sandbox:
              print(f"\nThroughput under gVisor: {100 * float(sandbox['Requests/s']) / float(plain['Requests/s']):.0f} % of the plain stack.")
          PY
          cat cost.md >> "$GITHUB_STEP_SUMMARY"

      - name: Why did it fail? (diagnostics)
        if: failure()
        # must never fail itself, or it hides the real error: the containers may be stopped, or not exist
        run: |
          set +e
          f="-f docker-compose.yml -f docker-compose.gvisor.yml"
          echo "=== containers, stopped ones included"; docker compose $f ps -a
          ids=$(docker compose $f ps -aq)
          if [ -z "$ids" ]; then
            echo "No container exists: the job failed before a stack was started, see the first red step above."
            exit 0
          fi
          echo "=== state of each container (runtime runc: this is still the plain stack)"
          for id in $ids; do
            docker inspect -f '{{.Name}} runtime={{.HostConfig.Runtime}} status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}{{if .State.Health}} health={{.State.Health.Status}}{{range .State.Health.Log}} | check exit {{.ExitCode}}: {{.Output}}{{end}}{{end}}' "$id"
          done
          echo "=== logs"; docker compose $f logs --tail=60
          echo "=== Docker daemon, runtime errors"; sudo journalctl -u docker --since "-10 min" --no-pager | grep -i -E "runsc|error" | tail -20
          nginx=$(docker compose $f ps -q nginx | head -1)
          app=$(docker compose $f ps -q app | head -1)
          if [ -z "$nginx" ] || [ -z "$app" ]; then
            echo "nginx or app is not running: no network check (their state and logs are above)."
            exit 0
          fi
          echo "=== resolver the nginx container uses"; docker exec "$nginx" cat /etc/resolv.conf
          echo "=== can the nginx container resolve and reach the app?"
          docker exec "$nginx" nslookup app 2>&1 | tail -4
          docker exec "$nginx" wget -q -O /dev/null -T 3 "http://app:5000/allmovies?start=0&end=1" && echo "reached app by name" || echo "NOT reachable by name"
          app_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$app")
          docker exec "$nginx" wget -q -O /dev/null -T 3 "http://$app_ip:5000/allmovies?start=0&end=1" && echo "reached app by IP $app_ip" || echo "NOT reachable by IP either"
          exit 0

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.gvisor.yml down -v

  energy-test:
    # Estimates the energy the stack uses: idle, then under the same load with the nginx cache bypassed
    # and with the caches on. Eco CI (https://github.com/green-coding-solutions/eco-ci-energy-estimation)
    # models the energy of the runner from its CPU use; scripts/energy_report.py relates it to the
    # requests served. Nothing leaves GitHub (send-data: false). The numbers are an estimate, good to
    # compare runs and to catch a regression, not an absolute figure.
    # continue-on-error: this job has not passed on a real runner yet. Remove it once green.
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"

      - name: Install the load-test tool
        run: |
          uv venv --python 3.12
          uv pip install locust

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Start the energy measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          send-data: false
          # also write each measurement to /tmp/eco-ci/lap-data.json, which scripts/energy_report.py reads
          json-output: true

      - name: Idle stack for 30 s
        run: sleep 30

      - name: Measure the idle stack
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: idle 30 s

      - name: Load, nginx cache bypassed
        env:
          NO_CACHE: 1
        run: |
          uv run locust -f backend/performance/locustfile.py --host=http://localhost:5000 \
            --headless -u 50 -t 40s --csv=nocache

      - name: Measure the load without nginx cache
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: load, nginx cache bypassed

      - name: Load, caches on
        run: |
          uv run locust -f backend/performance/locustfile.py --host=http://localhost:5000 \
            --headless -u 50 -t 40s --csv=cached

      - name: Measure the load with caches
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: load, caches on

      - name: Show the energy table
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results

      - name: Energy per request
        run: |
          count() { python3 -c "import csv,sys; print(next(r for r in csv.DictReader(open(sys.argv[1])) if r['Name']=='Aggregated')['Request Count'])" "$1"; }
          python3 scripts/energy_report.py --data /tmp/eco-ci/lap-data.json --output energy-summary.md \
            --idle "idle 30 s" \
            --phase "load, nginx cache bypassed=$(count nocache_stats.csv)" \
            --phase "load, caches on=$(count cached_stats.csv)"
          cat energy-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=60

      - name: Clean up
        if: always()
        run: docker compose down -v
